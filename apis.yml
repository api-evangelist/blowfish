aid: blowfish
name: Blowfish
description: >-
  Blowfish is a proactive web3 security platform that scans EVM and Solana transactions, EVM
  messages, and dApp domains before a user signs, returning a recommended action (NONE, WARN,
  or BLOCK), severity-sorted warnings, and human-readable transaction simulation results. Its
  Scan API and downloadable domain blocklist help wallets and dApps protect users from scams,
  malicious token approvals, and phishing across 10+ blockchains. Backed by Paradigm.
